name: Desktop - Instaladores

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - sistema: windows
            runner: windows-latest
            objetivo: '--win nsis'
            artefacto: LibreriaApp-Windows
          - sistema: mac
            runner: macos-latest
            objetivo: '--mac dmg --x64 --arm64'
            artefacto: LibreriaApp-macOS
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: desktop

      - name: Compilar renderer y electron
        run: npm run build
        working-directory: desktop

      - name: Empaquetar instalador
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.objetivo }}
        working-directory: desktop

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
          if-no-files-found: error

  publicar:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: LibreriaApp-*
          path: instaladores
          merge-multiple: true

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Librería App Escritorio ${{ github.ref_name }}
          body: |
            Instaladores de la versión de escritorio (Windows y macOS).

            - **Windows**: archivo `.exe` (instalador NSIS).
            - **macOS**: archivo `.dmg` (Intel y Apple Silicon).
          files: |
            instaladores/*.exe
            instaladores/*.dmg
          generate_release_notes: true